<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neuroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Subtle Outer Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1e293b" stroke-width="8" />

  <!-- Neurodiversity Rainbow Infinity Loop / Connection Symbol in Teal & Emerald -->
  <g transform="translate(256, 256)">
    <!-- Infinity Path -->
    <path d="M -110 0 C -110 -65, -45 -65, 0 0 C 45 65, 110 65, 110 0 C 110 -65, 45 -65, 0 0 C -45 65, -110 65, -110 0 Z" 
          fill="none" 
          stroke="url(#neuroGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Connecting Neural Nodes -->
    <circle cx="-75" cy="0" r="14" fill="#5eead4" />
    <circle cx="0" cy="0" r="16" fill="#34d399" />
    <circle cx="75" cy="0" r="14" fill="#5eead4" />

    <!-- Pulse Signal Ring around Center -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#5eead4" stroke-width="4" opacity="0.6" stroke-dasharray="8 6" />
  </g>
</svg>
