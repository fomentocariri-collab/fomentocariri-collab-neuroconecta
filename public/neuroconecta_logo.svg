<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <style>
    .brand-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 82px; }
    .brand-slogan { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 28px; fill: #1e293b; }
  </style>

  <g transform="translate(400, 280)">
    <!-- Rainbow Brain Outer Puzzle Pieces Left Side -->
    <path d="M -160,-100 C -180,-60 -210,0 -180,60 C -160,100 -120,130 -60,140" fill="none" stroke="url(#purpleGrad)" stroke-width="20" stroke-linecap="round" />
    <path d="M -180,-30 C -220,10 -220,70 -170,110" fill="none" stroke="url(#blueGrad)" stroke-width="18" stroke-linecap="round" />
    <path d="M -140,-130 C -190,-120 -200,-50 -160,-10" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" />

    <!-- Brain Right Side Contour -->
    <path d="M 60,-160 C 140,-160 200,-110 210,-30 C 220,50 180,120 100,150" fill="none" stroke="#0284c7" stroke-width="14" stroke-linecap="round" />

    <!-- Central Hugging Family Silhouette -->
    <g transform="translate(0, 10)">
      <!-- Parent/Center Figure -->
      <circle cx="0" cy="-60" r="22" fill="#1e1b4b" />
      <path d="M -40,30 C -40,-25 40,-25 40,30 C 40,60 -40,60 -40,30 Z" fill="#1e1b4b" />
      <!-- Left Child Figure -->
      <circle cx="-50" cy="-25" r="16" fill="#8b5cf6" />
      <path d="M -75,45 C -75,5 25,-15 -25,45 Z" fill="#8b5cf6" />
      <!-- Right Child Figure -->
      <circle cx="50" cy="-25" r="16" fill="#06b6d4" />
      <path d="M 25,45 C -25,-15 75,5 75,45 Z" fill="#22d3ee" />

      <!-- Surrounding Heart Arms -->
      <path d="M -80,10 C -120,-30 -100,-90 -40,-70 C 0,-50 0,0 0,0 C 0,0 0,-50 40,-70 C 100,-90 120,-30 80,10 C 50,40 0,80 0,80 C 0,80 -50,40 -80,10 Z" fill="none" stroke="url(#pinkGrad)" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- Mini Floating Icons on Right Side -->
    <g transform="translate(130, -100)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#0284c7" stroke-width="3" />
      <path d="M -7,0 H 7 M 0,-7 V 7" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    </g>

    <g transform="translate(165, -30)">
      <circle cx="0" cy="-6" r="6" fill="#8b5cf6" />
      <circle cx="-10" cy="-2" r="4" fill="#ec4899" />
      <circle cx="10" cy="-2" r="4" fill="#06b6d4" />
    </g>

    <g transform="translate(155, 45)">
      <path d="M -14,-2 L 0,-10 L 14,-2 L 0,6 Z" fill="#0284c7" />
      <path d="M -8,2 V 8 C -8,11 8,11 8,8 V 2" fill="none" stroke="#0284c7" stroke-width="2.5" />
    </g>

    <g transform="translate(115, 110)">
      <path d="M -12,2 L 0,-10 L 12,2 V 12 H -12 Z" fill="none" stroke="#f97316" stroke-width="3" />
    </g>
  </g>

  <!-- Typography Section -->
  <g transform="translate(400, 560)">
    <text text-anchor="middle" class="brand-title">
      <tspan fill="#0f172a">Neuro</tspan><tspan fill="#8b5cf6">Co</tspan><tspan fill="#10b981">nec</tspan><tspan fill="#f97316">ta</tspan>
    </text>

    <line x1="-180" y1="40" x2="180" y2="40" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="0" cy="40" r="6" fill="#06b6d4" />

    <text y="90" text-anchor="middle" class="brand-slogan">
      Conexões que acolhem, informam e transformam.
    </text>

    <g transform="translate(0, 130)">
      <circle cx="-90" cy="0" r="7" fill="#8b5cf6" />
      <circle cx="-60" cy="0" r="7" fill="#0284c7" />
      <circle cx="-30" cy="0" r="7" fill="#06b6d4" />
      <circle cx="0" cy="0" r="7" fill="#10b981" />
      <circle cx="30" cy="0" r="7" fill="#eab308" />
      <circle cx="60" cy="0" r="7" fill="#f97316" />
      <circle cx="90" cy="0" r="7" fill="#ec4899" />
    </g>
  </g>
</svg>
