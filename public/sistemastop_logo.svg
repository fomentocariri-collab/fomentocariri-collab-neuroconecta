<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="50%" stop-color="#146c43" />
      <stop offset="100%" stop-color="#08331e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Diamond Circuit Base -->
  <g transform="translate(250, 250) rotate(45)">
    <rect x="-160" y="-160" width="320" height="320" rx="36" fill="url(#circGrad)" stroke="url(#goldGrad)" stroke-width="8" />
    <rect x="-140" y="-140" width="280" height="280" rx="24" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  </g>

  <!-- Circuit Paths -->
  <g stroke="url(#goldGrad)" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Top & Bottom nodes -->
    <path d="M 250, 40 L 250, 120" />
    <circle cx="250" cy="40" r="8" fill="#146c43" stroke="url(#goldGrad)" stroke-width="4" />
    
    <path d="M 250, 460 L 250, 380" />
    <circle cx="250" cy="460" r="8" fill="#146c43" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Left & Right nodes -->
    <path d="M 40, 250 L 120, 250" />
    <circle cx="40" cy="250" r="8" fill="#146c43" stroke="url(#goldGrad)" stroke-width="4" />

    <path d="M 460, 250 L 380, 250" />
    <circle cx="460" cy="250" r="8" fill="#146c43" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Corner Circuit Traces -->
    <path d="M 120, 120 L 170, 170 H 210" />
    <circle cx="120" cy="120" r="5" fill="url(#goldGrad)" />
    
    <path d="M 380, 120 L 330, 170 H 290" />
    <circle cx="380" cy="120" r="5" fill="url(#goldGrad)" />

    <path d="M 120, 380 L 170, 330 H 210" />
    <circle cx="120" cy="380" r="5" fill="url(#goldGrad)" />

    <path d="M 380, 380 L 330, 330 H 290" />
    <circle cx="380" cy="380" r="5" fill="url(#goldGrad)" />
  </g>

  <!-- STP Center Lettering -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- S -->
    <path d="M 140, 200 H 200 V 225 H 165 V 245 H 200 V 295 H 140 V 270 H 175 V 255 H 140 Z" />
    <!-- T -->
    <path d="M 215, 200 H 285 V 225 H 262 V 295 H 238 V 225 H 215 Z" />
    <!-- P -->
    <path d="M 300, 200 H 355 C 370, 200 370, 250 355, 250 H 325 V 295 H 300 Z M 325, 220 V 232 H 345 C 350, 232 350, 220 345, 220 Z" />
  </g>

  <!-- Subtitle Text -->
  <text x="250" y="340" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="4">SISTEMASTOP</text>
  <text x="250" y="362" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#22c55e" letter-spacing="2">SOLUÇÕES TECNOLÓGICAS</text>
</svg>
